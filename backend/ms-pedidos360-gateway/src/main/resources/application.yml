spring:
  application:
    name: ms-pedidos360-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders
              uri: ${BFF_BASE_URL:http://localhost:8080}
              predicates:
                - Path=/api/orders/**
            - id: catalog
              uri: ${BFF_BASE_URL:http://localhost:8080}
              predicates:
                - Path=/api/catalog/**
            - id: me
              uri: ${BFF_BASE_URL:http://localhost:8080}
              predicates:
                - Path=/me
            - id: mq-admin
              uri: ${MQ_ADMIN_BASE_URL:http://localhost:8083}
              predicates:
                - Path=/api/mq/**
          httpclient:
            connect-timeout: 5000
            response-timeout: 15s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
server:
  port: ${SERVER_PORT:8090}
pedidos360:
  jwt:
    audience: ${JWT_AUDIENCE}
    required-scope: ${JWT_REQUIRED_SCOPE:access_as_user}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
