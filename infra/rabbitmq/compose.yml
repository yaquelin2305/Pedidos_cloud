# Cluster RabbitMQ de 2 nodos. Se incluye desde el compose.yml raiz; tambien se puede levantar solo:
#   docker compose --project-directory . --env-file .env -f infra/rabbitmq/compose.yml up -d
services:
  rabbitmq-1:
    image: rabbitmq:4.1-management
    hostname: rabbitmq-1
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Define RABBITMQ_ERLANG_COOKIE}
    # Solo la consola de administracion y solo en loopback; AMQP queda interno a la red de Compose.
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-1-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  rabbitmq-2:
    image: rabbitmq:4.1-management
    hostname: rabbitmq-2
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Define RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq-2-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      rabbitmq-1:
        condition: service_healthy

volumes:
  rabbitmq-1-data:
  rabbitmq-2-data:
