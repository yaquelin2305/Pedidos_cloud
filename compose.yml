services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Define VITE_API_BASE_URL}
        VITE_API_SCOPE: ${VITE_API_SCOPE:?Define VITE_API_SCOPE}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID:?Define VITE_AZURE_CLIENT_ID}
        VITE_AZURE_AUTHORITY: ${VITE_AZURE_AUTHORITY:?Define VITE_AZURE_AUTHORITY}
        VITE_AZURE_KNOWN_AUTHORITY: ${VITE_AZURE_KNOWN_AUTHORITY:-}
        VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI:?Define VITE_AZURE_REDIRECT_URI}
        VITE_AZURE_POST_LOGOUT_REDIRECT_URI: ${VITE_AZURE_POST_LOGOUT_REDIRECT_URI:?Define VITE_AZURE_POST_LOGOUT_REDIRECT_URI}
    # Mismo puerto que Vite para reutilizar las redirect URIs registradas en Azure.
    ports:
      - "5173:80"
    depends_on:
      - gateway

  gateway:
    build: ./backend/ms-pedidos360-gateway
    mem_limit: 320m
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?Define JWT_ISSUER_URI}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Define JWT_AUDIENCE}
      JWT_REQUIRED_SCOPE: access_as_user
      BFF_BASE_URL: http://bff:8080
      MQ_ADMIN_BASE_URL: http://mq-admin:8083
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      - bff
      - mq-admin

  bff:
    build: ./backend/ms-pedidos360-bff
    mem_limit: 320m
    environment:
      SERVER_PORT: 8080
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?Define JWT_ISSUER_URI}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Define JWT_AUDIENCE}
      ORDERS_BASE_URL: http://orders:8081
      CATALOG_BASE_URL: http://catalog:8082
    depends_on:
      - orders
      - catalog

  orders:
    build: ./backend/ms-pedidos360-orders
    mem_limit: 448m
    environment:
      SERVER_PORT: 8081
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?Define JWT_ISSUER_URI}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Define JWT_AUDIENCE}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pedidos360}
      DB_USERNAME: ${DB_USERNAME:-pedidos360}
      DB_PASSWORD: ${DB_PASSWORD:-pedidos360}
      JPA_DDL_AUTO: update
      CATALOG_SERVICE_URL: http://catalog:8082
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
      catalog:
        condition: service_started

  catalog:
    build: ./backend/ms-pedidos360-catalog
    mem_limit: 448m
    environment:
      SERVER_PORT: 8082
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?Define JWT_ISSUER_URI}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Define JWT_AUDIENCE}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pedidos360}
      DB_USERNAME: ${DB_USERNAME:-pedidos360}
      DB_PASSWORD: ${DB_PASSWORD:-pedidos360}
      JPA_DDL_AUTO: update
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy

  mq-admin:
    build: ./backend/ms-pedidos360-mq-admin
    mem_limit: 320m
    environment:
      SERVER_PORT: 8083
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?Define JWT_ISSUER_URI}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Define JWT_AUDIENCE}
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy

  rabbitmq-1:
    image: rabbitmq:4.1-management
    hostname: rabbitmq-1
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Define RABBITMQ_ERLANG_COOKIE}
    # Solo la consola de administracion y solo en loopback; AMQP queda interno a la red de Compose.
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-1-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  rabbitmq-2:
    image: rabbitmq:4.1-management
    hostname: rabbitmq-2
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Define RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq-2-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      rabbitmq-1:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pedidos360}
      POSTGRES_USER: ${DB_USERNAME:-pedidos360}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pedidos360}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-1-data:
  rabbitmq-2-data:
