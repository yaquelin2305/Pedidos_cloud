server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 52.207.140.106.nip.io;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/52.207.140.106.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/52.207.140.106.nip.io/privkey.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.52.207.140.106.nip.io;

    ssl_certificate /etc/letsencrypt/live/52.207.140.106.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/52.207.140.106.nip.io/privkey.pem;

    location / {
        proxy_pass http://gateway:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
